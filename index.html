<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL — Text</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #000;
    --surface: #0a0a0a;
    --panel: #111;
    --border: rgba(0,255,0,0.2);
    --border-bright: rgba(0,255,0,0.5);
    --accent: #0f0;
    --accent-dim: #0a0;
    --accent-glow: rgba(0,255,0,0.15);
    --danger: #f55;
    --warn: #fa0;
    --text: #0f0;
    --muted: #0a0;
    --dim: rgba(0,255,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: monospace;
    height: 100%;
    overflow: hidden;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.06) 2px,
      rgba(0,0,0,0.06) 4px
    );
    pointer-events: none;
    z-index: 9998;
  }

  .app {
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: 48px 1fr;
    height: 100vh;
  }

  /* ── HEADER ── */
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    background: #000;
  }

  .logo {
    font-family: monospace;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 4px;
    color: var(--accent);
    text-shadow: 0 0 10px rgba(0,255,0,0.5);
  }

  .logo span {
    color: var(--muted);
    font-size: 9px;
    display: block;
    letter-spacing: 3px;
    font-weight: normal;
    margin-top: -2px;
  }

  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 12px;
    background: transparent;
    border: 1px solid var(--border);
    font-family: monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
  }

  /* Signaling status pill */
  .sig-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 12px;
    background: transparent;
    border: 1px solid var(--border);
    font-family: monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #333;
    transition: all 0.3s;
  }
  .status-dot.online { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .status-dot.calling { background: var(--warn); box-shadow: 0 0 6px var(--warn); animation: blink 1s infinite; }
  .status-dot.in-call { background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: blink 1.5s infinite; }
  .status-dot.sig-ok { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .status-dot.sig-err { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
  .status-dot.sig-connecting { background: var(--warn); box-shadow: 0 0 6px var(--warn); animation: blink 0.8s infinite; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ── SIDEBAR ── */
  .sidebar {
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .sidebar-section {
    padding: 14px 14px 10px;
  }

  .sidebar-label {
    font-family: monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--muted);
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .id-card {
    background: #050505;
    border: 1px solid var(--border);
    padding: 12px;
    position: relative;
  }

  .id-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
  }

  .id-label {
    font-family: monospace;
    font-size: 8px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .my-id {
    font-family: monospace;
    font-size: 12px;
    color: var(--accent);
    word-break: break-all;
    line-height: 1.6;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .my-id:hover { opacity: 0.6; }

  .copy-hint {
    font-family: monospace;
    font-size: 9px;
    color: var(--muted);
    margin-top: 5px;
    opacity: 0;
    transition: opacity 0.2s;
    letter-spacing: 1px;
  }
  .id-card:hover .copy-hint { opacity: 1; }

  .connect-input-wrap { display: flex; flex-direction: column; gap: 8px; }

  .field { display: flex; flex-direction: column; gap: 5px; }

  .field label {
    font-family: monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  input[type="text"] {
    background: #050505;
    border: 1px solid var(--border);
    padding: 8px 10px;
    color: var(--accent);
    font-family: monospace;
    font-size: 12px;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-glow); }
  input[type="text"]::placeholder { color: rgba(0,170,0,0.4); }

  button, .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 14px;
    background: #000;
    color: var(--accent);
    border: 1px solid rgba(0,255,0,0.4);
    font-family: monospace;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }
  button:hover, .btn:hover { background: var(--accent-glow); border-color: var(--accent); }
  button:disabled, .btn:disabled { opacity: 0.3; pointer-events: none; }

  .btn-primary { background: transparent; color: var(--accent); border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent); color: #000; box-shadow: 0 0 12px rgba(0,255,0,0.3); }
  .btn-secondary { color: var(--accent); border-color: rgba(0,255,0,0.3); }
  .btn-secondary:hover { background: var(--accent-glow); border-color: var(--accent); }
  .btn-danger { color: var(--danger); border-color: rgba(255,85,85,0.4); }
  .btn-danger:hover { background: rgba(255,85,85,0.1); border-color: var(--danger); }
  .btn-ghost { color: var(--muted); border-color: var(--border); }
  .btn-ghost:hover { color: var(--accent); border-color: rgba(0,255,0,0.4); }
  .btn-full { width: 100%; }
  .call-controls { display: flex; gap: 6px; }
  .mt-8 { margin-top: 8px; }
  .mt-12 { margin-top: 12px; }

  .divider { height: 1px; background: var(--border); }



  
  /* ── MAIN ── */
  .main {
    display: grid;
    grid-template-rows: 1fr auto;
    overflow: hidden;
    min-width: 0;
  }
  .chat-area {
    position: relative;
    background: #020202;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .chat-area::before {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(0,255,0,0.06);
    pointer-events: none;
    z-index: 1;
  }
  .corner { position: absolute; width: 16px; height: 16px; z-index: 2; pointer-events: none; }
  .corner-tl { top: 8px; left: 8px; border-top: 1px solid var(--accent); border-left: 1px solid var(--accent); }
  .corner-tr { top: 8px; right: 8px; border-top: 1px solid var(--accent); border-right: 1px solid var(--accent); }
  .corner-bl { bottom: 8px; left: 8px; border-bottom: 1px solid var(--accent); border-left: 1px solid var(--accent); }
  .corner-br { bottom: 8px; right: 8px; border-bottom: 1px solid var(--accent); border-right: 1px solid var(--accent); }
  .idle-state {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: var(--muted);
    text-align: center;
    z-index: 2;
    pointer-events: none;
  }
  .idle-icon {
    width: 72px; height: 72px;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    background: #050505;
    position: relative;
  }
  .idle-icon::after {
    content: '';
    position: absolute;
    inset: -10px;
    border: 1px solid rgba(0,255,0,0.08);
    animation: ripple 3s infinite;
  }
  @keyframes ripple {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  .idle-title { font-family: monospace; font-size: 14px; letter-spacing: 4px; color: rgba(0,255,0,0.3); }
  .idle-sub { font-family: monospace; font-size: 10px; letter-spacing: 2px; color: var(--muted); opacity: 0.5; }
  .messages { position: relative; z-index: 3; min-height: 0; padding: 24px 32px !important; }
  .bottom-bar { border-top: 1px solid var(--border); background: var(--surface); }
  .chat-input-row { padding: 12px 16px !important; }
.messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-width: 72%;
    animation: msgIn 0.15s ease;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.me { align-self: flex-end; align-items: flex-end; }
  .msg.them { align-self: flex-start; align-items: flex-start; }

  .msg-bubble {
    padding: 8px 12px;
    font-family: monospace;
    font-size: 12px;
    line-height: 1.5;
    border: 1px solid var(--border);
  }

  .msg.me .msg-bubble {
    background: rgba(0,255,0,0.08);
    color: var(--accent);
    border-color: rgba(0,255,0,0.3);
  }

  .msg.them .msg-bubble {
    background: #050505;
    color: var(--muted);
    border-color: var(--border);
  }

  .msg-meta {
    font-family: monospace;
    font-size: 9px;
    color: rgba(0,170,0,0.5);
    letter-spacing: 1px;
  }

  .chat-input-row {
    display: flex;
    gap: 6px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
  }

  .chat-input-row input { flex: 1; }

  .log {
    font-family: monospace;
    font-size: 10px;
    color: var(--muted);
    padding: 6px 12px;
    max-height: 54px;
    overflow-y: auto;
    border-top: 1px solid var(--border);
    letter-spacing: 1px;
    line-height: 1.8;
    background: #000;
  }

  .log .entry { color: rgba(0,170,0,0.6); }
  .log .entry.ok { color: var(--accent); }
  .log .entry.err { color: var(--danger); }
  .log .entry.warn { color: var(--warn); }

  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: #111;
    border: 1px solid var(--accent);
    padding: 10px 20px;
    font-family: monospace;
    font-size: 11px;
    color: var(--accent);
    z-index: 9999;
    transition: transform 0.25s ease;
    pointer-events: none;
    white-space: nowrap;
    letter-spacing: 2px;
    box-shadow: 0 0 20px rgba(0,255,0,0.15);
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ── COPYRIGHT ── */
  .copyright {
    position: fixed;
    bottom: 10px;
    left: 0;
    width: 280px;
    text-align: center;
    font-family: monospace;
    font-size: 9px;
    color: rgba(0,170,0,0.35);
    letter-spacing: 1px;
    z-index: 9999;
    pointer-events: none;
    user-select: none;
  }

  #nameModal { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; }
  #nameModal .box { background: var(--panel); border: 1px solid var(--border-bright); padding: 22px; width: min(340px, 90vw); display: flex; flex-direction: column; gap: 14px; }
  #nameModal .title { letter-spacing: 2px; font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">SIGNAL<span>WEBRTC // TEXT MODE</span></div>
    <div class="header-right">
      <div class="sig-pill">
        <div class="status-dot sig-connecting" id="sigDot"></div>
        <span id="sigText">SIGNAL...</span>
      </div>
      <div class="status-pill">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">OFFLINE</span>
      </div>
    </div>
  </header>

  <aside class="sidebar">
    <div class="sidebar-scroll">
      <div class="sidebar-section">
        <div class="sidebar-label">NODE IDENTIFIER</div>
        <div class="id-card">
          <div class="id-label">PEER ID</div>
          <div class="my-id" id="myId" onclick="copyId()">INITIALIZING...</div>
          <div class="copy-hint">↑ CLICK TO COPY</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="sidebar-section">
        <div class="sidebar-label">CONNECT TO PEER</div>
        <div class="connect-input-wrap">
          <div class="field">
            <label>REMOTE PEER ID</label>
            <input type="text" id="remoteIdInput" placeholder="PASTE PEER ID..." autocomplete="off" spellcheck="false" />
          </div>
          <button class="btn btn-primary btn-full" id="chatConnectBtn" onclick="connectChat()" disabled>[ CONNECT ]</button>
        </div>
      </div>
      <div class="divider"></div>
      <div class="sidebar-section">
        <div class="sidebar-label">NETWORK</div>
        <div style="background:#050505;border:1px solid var(--border);padding:10px;font-size:9px;color:var(--muted);letter-spacing:1px;line-height:1.8">
          SIGNALING: PEERJS CLOUD<br>
          ICE: GOOGLE STUN<br>
          TRANSPORT: WEBRTC DATA CHANNEL
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="chat-area">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div class="idle-state" id="idleState">
        <div class="idle-icon">📡</div>
        <div class="idle-title">NO ACTIVE SESSION</div>
        <div class="idle-sub">ENTER PEER ID TO ESTABLISH LINK</div>
      </div>
      <div class="messages" id="messages"></div>
    </div>
    <div class="bottom-bar">
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="TYPE MESSAGE..." autocomplete="off" disabled />
        <button class="btn btn-primary" id="sendBtn" onclick="sendMsg()" disabled>SEND</button>
      </div>
      <div class="log" id="logEl"></div>
    </div>
  </main>
</div>
<div id="nameModal">
  <div class="box">
    <div class="title">ENTER YOUR NAME</div>
    <div class="field">
      <label>NAME</label>
      <input type="text" id="nameInput" placeholder="E.G. JON" maxlength="16" autocomplete="off" spellcheck="false" />
    </div>
    <button class="btn btn-primary btn-full" id="nameBtn">[ START ]</button>
  </div>
</div>
<div id="toast"></div>

<script>
let peer = null;
let conn = null;
let announceTimer = null;
let pendingConnect = null;
const TOPIC = 'jon-signal-7f3k2q9x';
const $ = id => document.getElementById(id);

window.onload = () => {
  setStatus('offline');
  setSigStatus('connecting');
  askName();
  $('remoteIdInput').addEventListener('input', refreshButtons);
  $('remoteIdInput').addEventListener('keydown', e => { if (e.key === 'Enter') connectChat(); });
  $('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
};

// index page can tell us who to connect to
window.addEventListener('message', e => {
  if (e.source !== parent) return;
  const d = e.data;
  if (!d || d.type !== 'connect' || typeof d.id !== 'string') return;
  if (peer && peer.open) { $('remoteIdInput').value = d.id; connectChat(); }
  else pendingConnect = d.id;
});

function askName() {
  let saved = '';
  try { saved = localStorage.getItem('signalName') || ''; } catch {}
  const input = $('nameInput');
  input.value = saved;
  input.focus();
  const go = () => {
    const name = input.value.replace(/[^a-zA-Z0-9]/g, '').slice(0, 16);
    if (!name) { toast('ENTER A NAME'); return; }
    try { localStorage.setItem('signalName', name); } catch {}
    $('nameModal').style.display = 'none';
    initPeer(name);
  };
  $('nameBtn').onclick = go;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

function makeId(name) {
  return name + '-' + crypto.randomUUID().split('-').slice(1).join('-');
}

let myName = '';
function initPeer(name) {
  if (name) myName = name;
  peer = new Peer(makeId(myName), { debug: 0 });

  peer.on('open', id => {
    $('myId').textContent = id;
    setSigStatus('ok');
    setStatus('online');
    log('NODE INITIALIZED · ID: ' + id, 'ok');
    const announce = () => fetch('https://ntfy.sh/' + TOPIC, { method: 'POST', body: id }).catch(() => {});
    announce();
    if (pendingConnect) { $('remoteIdInput').value = pendingConnect; connectChat(); pendingConnect = null; }
    clearInterval(announceTimer);
    announceTimer = setInterval(announce, 30000);
    refreshButtons();
  });

  peer.on('error', err => {
    log('PEER ERROR: ' + err.type, 'err');
    if (err.type === 'unavailable-id') { setTimeout(initPeer, 500); return; }
    setSigStatus('err');
    if (['server-error','socket-error','socket-closed','network'].includes(err.type)) {
      setSigStatus('connecting');
      setTimeout(initPeer, 4000);
    }
  });

  peer.on('disconnected', () => {
    setSigStatus('err');
    log('SIGNALING DISCONNECTED — RECONNECTING...', 'warn');
    peer.reconnect();
  });

  peer.on('connection', c => {
    log('INCOMING CHAT FROM ' + c.peer, 'warn');
    toast('CHAT FROM ' + c.peer);
    setupConn(c);
  });
}

function setupConn(c) {
  if (conn && conn !== c) conn.close();
  conn = c;
  const onOpen = () => {
    log('DATA CHANNEL OPEN', 'ok');
    toast('CHAT CONNECTED');
    setStatus('in-call');
    $('idleState').style.display = 'none';
    $('chatInput').disabled = false;
    $('sendBtn').disabled = false;
    $('chatInput').focus();
  };
  if (c.open) onOpen(); else c.on('open', onOpen);
  c.on('data', data => {
    try {
      const msg = typeof data === 'string' ? JSON.parse(data) : data;
      if (msg.type === 'chat') addMessage(msg.text, 'them');
    } catch { addMessage(String(data), 'them'); }
  });
  c.on('close', () => {
    if (conn !== c) return;
    log('DATA CHANNEL CLOSED', 'warn');
    toast('PEER DISCONNECTED');
    conn = null;
    setStatus('online');
    $('chatInput').disabled = true;
    $('sendBtn').disabled = true;
    if (!$('messages').children.length) $('idleState').style.display = 'flex';
  });
  c.on('error', e => log('DATA ERROR: ' + e.message, 'err'));
}

function connectChat() {
  const remoteId = $('remoteIdInput').value.trim();
  if (!remoteId) { toast('ENTER A PEER ID'); return; }
  if (!peer || peer.disconnected) { toast('SIGNALING NOT CONNECTED'); return; }
  log('OPENING CHAT TO ' + remoteId + '...');
  setStatus('calling');
  setupConn(peer.connect(remoteId, { reliable: true }));
  toast('CHAT REQUEST SENT...');
}

function sendMsg() {
  const text = $('chatInput').value.trim();
  if (!text) return;
  if (!conn || !conn.open) { toast('CHAT NOT CONNECTED YET'); return; }
  conn.send(JSON.stringify({ type: 'chat', text }));
  addMessage(text, 'me');
  $('chatInput').value = '';
}

function addMessage(text, who) {
  const msgs = $('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  div.innerHTML = `<div class="msg-bubble">${escHtml(text)}</div><div class="msg-meta">${who === 'me' ? 'YOU' : 'PEER'} · ${t}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setStatus(state) {
  $('statusDot').className = 'status-dot ' + state;
  const labels = { online: 'ONLINE', calling: 'CONNECTING...', 'in-call': 'CONNECTED', offline: 'OFFLINE' };
  $('statusText').textContent = labels[state] || state.toUpperCase();
}

function setSigStatus(state) {
  $('sigDot').className = 'status-dot sig-' + state;
  const labels = { ok: 'SIGNAL OK', err: 'NO SIGNAL', connecting: 'SIGNAL...' };
  $('sigText').textContent = labels[state] || state.toUpperCase();
}

function refreshButtons() {
  const has = $('remoteIdInput').value.trim().length > 0;
  const ready = peer && !peer.disconnected && !peer.destroyed;
  $('chatConnectBtn').disabled = !has || !ready;
}

function copyId() {
  const id = $('myId').textContent;
  navigator.clipboard.writeText(id).then(() => toast('PEER ID COPIED'))
    .catch(() => {
      const el = document.createElement('textarea');
      el.value = id; document.body.appendChild(el); el.select();
      document.execCommand('copy'); document.body.removeChild(el);
      toast('PEER ID COPIED');
    });
}

let toastTimer;
function toast(msg) {
  const el = $('toast');
  el.textContent = '> ' + msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

function log(msg, type = '') {
  const el = $('logEl');
  const span = document.createElement('span');
  span.className = 'entry ' + type;
  span.textContent = `[${new Date().toLocaleTimeString()}] ${msg}  `;
  el.appendChild(span);
  el.scrollTop = el.scrollHeight;
}
</script>
